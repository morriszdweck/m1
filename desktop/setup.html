<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>M1</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f3f4;
        --fg: #1a1c1f;
        --fg-3: #8b8f96;
        --accent: #0a7ae6;
        --danger: #e5484d;
        --btn: #1a1c1f;
        --btn-fg: #fcfcfc;
        --line: rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0b;
          --fg: #fcfcfc;
          --fg-3: #7d8087;
          --accent: #55a8ff;
          --danger: #ff6369;
          --btn: #fcfcfc;
          --btn-fg: #1a1c1f;
          --line: rgba(255, 255, 255, 0.14);
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        user-select: none;
      }
      /* Only this strip moves the window, so the rest of the page always takes clicks. */
      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 38px;
        -webkit-app-region: drag;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 440px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        color: var(--accent);
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #status {
        min-height: 20px;
        color: var(--fg-3);
      }
      .bad #status {
        color: var(--danger);
        user-select: text;
        cursor: text;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid color-mix(in srgb, var(--fg-3) 35%, transparent);
        border-top-color: var(--fg);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .bad .spinner {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .actions {
        display: none;
        gap: 8px;
      }
      .bad .actions {
        display: flex;
      }
      button {
        height: 34px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--btn);
        background: var(--btn);
        color: var(--btn-fg);
      }
      button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <main>
      <div class="logo" aria-label="M1">M1</div>
      <div class="spinner"></div>
      <div id="status">Starting…</div>
      <div class="actions">
        <button class="primary" id="retry">Try again</button>
        <button id="log" hidden>Show log</button>
      </div>
    </main>
    <script>
      const status = document.getElementById("status");
      // The app watches the address for these, since this page has no other way to reach it.
      const ask = (what) => (location.hash = `${what}-${Date.now()}`);
      document.getElementById("retry").onclick = () => ask("retry");
      document.getElementById("log").onclick = () => ask("log");
      window.say = (text) => (status.textContent = text);
      window.failed = (text, hasLog) => {
        document.body.classList.add("bad");
        document.getElementById("log").hidden = !hasLog;
        status.textContent = text;
      };
    </script>
  </body>
</html>
