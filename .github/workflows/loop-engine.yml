name: Loop engine

# Builds the engine SenseNova Loop 9B runs on (engine/build-loop.sh) and publishes it under the
# tag that server/backends.js names (LOOP_ENGINE.tag). Runs when engine/ changes. The release is
# never marked latest, so installed copies keep updating from the newest build-N release.
on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/loop-engine.yml"]
  workflow_dispatch:

env:
  TAG: loop-engine-1

jobs:
  build:
    name: Build (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: metal, os: macos-latest }
          - { flavor: vulkan, os: ubuntu-22.04 }
          - { flavor: cpu, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan SDK (headers and shader compiler)
        if: matrix.flavor == 'vulkan'
        run: |
          version="$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/linux.txt)"
          mkdir -p "$RUNNER_TEMP/vulkan_sdk"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$version/linux/vulkan_sdk.tar.xz" | tar -xJ -C "$RUNNER_TEMP/vulkan_sdk" --strip-components 1
      - name: Build llama-server
        run: |
          if [ -f "$RUNNER_TEMP/vulkan_sdk/setup-env.sh" ]; then source "$RUNNER_TEMP/vulkan_sdk/setup-env.sh"; fi
          engine/build-loop.sh ${{ matrix.flavor }}
        timeout-minutes: 60
      - uses: actions/upload-artifact@v4
        with:
          name: loop-${{ matrix.flavor }}
          path: engine/dist/*.tar.gz*

  test:
    name: SenseNova Loop 9B answers at 1, 2 and 3 loops (CPU)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: loop-cpu
          path: dist
      - name: Download the model, then load it at each loop count and ask a question
        timeout-minutes: 60
        run: |
          tar -xzf dist/llama-loop-ubuntu-x64.tar.gz
          curl -fsSL --retry 5 -o model.gguf "https://huggingface.co/sensenova/SenseNova-Loop-9B-GGUF/resolve/main/SenseNova-Loop-9B-Q4_K_M.gguf?download=true"
          for loops in 1 2 3; do
            LLAMA_SENSENOVA_LOOPS=$loops ./llama-loop-ubuntu-x64/llama-server -m model.gguf --host 127.0.0.1 --port 8399 -c 2048 --jinja --reasoning-format none > server.log 2>&1 &
            pid=$!
            for i in $(seq 1 180); do curl -fs http://127.0.0.1:8399/health >/dev/null && break; sleep 2; done
            grep "runs its shared block" server.log || [ "$loops" = 2 ]
            answer=$(curl -fs http://127.0.0.1:8399/v1/chat/completions -H 'Content-Type: application/json' \
              -d '{"messages":[{"role":"user","content":"What is the capital of France? One word."}],"max_tokens":16,"temperature":0,"chat_template_kwargs":{"enable_thinking":false}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["choices"][0]["message"]["content"])')
            echo "loops=$loops: $answer"
            echo "$answer" | grep -qi paris
            kill $pid; wait $pid || true
          done

  publish:
    name: Publish ${{ env.TAG }}
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: loop-*
          merge-multiple: true
          path: dist
      - name: Create or update the release (never the latest one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --prerelease \
              --title "SenseNova Loop engine" \
              --notes "SenseNova's llama.cpp (OpenSenseNova/llama.cpp@24ea7bb) with engine/sensenova-loops.patch, which M1 uses to run SenseNova Loop 9B at 1 to 4 loops. Not an M1 release."
          fi
